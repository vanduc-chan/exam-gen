server {
    listen 80;
    client_max_body_size 50m;   # cho phép upload file Excel/Word

    root /usr/share/nginx/html;
    index index.html;

    # Mọi request /api/... chuyển sang container backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # SPA: route nào không có file thật thì trả về index.html
    location / {
        try_files $uri /index.html;
    }
}
