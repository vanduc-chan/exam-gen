# ---- Cổng 80: chỉ để Certbot gia hạn + chuyển hướng sang HTTPS ----
server {
    listen 80;
    server_name vanduc.tech www.vanduc.tech;

    # Thư mục Certbot dùng để xác thực khi gia hạn chứng chỉ
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Cổng 443: phục vụ web qua HTTPS ----
server {
    listen 443 ssl;
    http2 on;
    server_name vanduc.tech www.vanduc.tech;

    ssl_certificate     /etc/letsencrypt/live/vanduc.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vanduc.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50m;   # cho phép upload file Excel/Word

    root /usr/share/nginx/html;
    index index.html;

    # Mọi request /api/... chuyển sang container backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # SPA: route nào không có file thật thì trả về index.html
    location / {
        try_files $uri /index.html;
    }
}
