server:
  port: 8080

spring:
  application:
    name: exam-generator
  datasource:
    url: jdbc:postgresql://localhost:5432/exam_generator
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
